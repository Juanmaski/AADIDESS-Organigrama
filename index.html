<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AADIDESS — Organigrama</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}
#app{width:100%;height:100%;border:0;display:block;opacity:0}
</style>
</head>
<body>
<iframe id="app" src="app.html?v=711" title="AADIDESS Organigrama"></iframe>
<script>
const f=document.getElementById('app');
f.addEventListener('load',()=>{
  try{
    const d=f.contentDocument;
    const logo=d.querySelector('.brand-logo');
    if(logo){logo.src='logo.svg?v=2';logo.removeAttribute('srcset');}
    const sub=d.querySelector('.sub');
    if(sub && sub.textContent.includes('v7.10')) sub.textContent=sub.textContent.replace('v7.10','v7.11');
  }catch(e){}
  f.style.opacity='1';
});
</script>
</body>
</html>
